[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# This package contains no code: it only installs the commands of the tools of pyModbusTCP (module pyModbusTCP.tools)
# and their optional dependency (pyserial). A plain "pip install pyModbusTCP" puts no command in the PATH.

[project]
name = "pyModbusTCP-cli"
# version: the one of pyModbusTCP (../pyModbusTCP/constants.py, see [tool.hatch.version]), the two packages are always
# released together with the same version; dependencies: exactly this release of pyModbusTCP (set by hatch_build.py)
dynamic = ["version", "dependencies"]
description = "Command line tools for pyModbusTCP: Modbus/TCP server, client and Modbus TCP/RTU gateways"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Loïc Lefebvre" }]
license = "MIT"
license-files = ["LICENSE*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
]

[project.scripts]
mbtcp-server = "pyModbusTCP.tools._entry:run_server"
mbtcp-client = "pyModbusTCP.tools._entry:run_client"
mbtcp-tcp2rtu = "pyModbusTCP.tools._entry:run_tcp2rtu"
mbtcp-rtu2tcp = "pyModbusTCP.tools._entry:run_rtu2tcp"

[project.urls]
Source = "https://github.com/sourceperl/pyModbusTCP"
Issues = "https://github.com/sourceperl/pyModbusTCP/issues"

[tool.hatch.version]
# from the repository; a build from the sdist (no ../pyModbusTCP) reads the version and the dependencies in PKG-INFO
path = "../pyModbusTCP/constants.py"

[tool.hatch.metadata.hooks.custom]
# requirement on exactly this release of pyModbusTCP
path = "hatch_metadata_cli.py"

[tool.hatch.build.targets.wheel]
# no code in this package (see above): only the metadata and the commands
bypass-selection = true
