[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyModbusTCP"
dynamic = ["version"]
description = "A simple Modbus/TCP library for Python"
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name = "Loïc Lefebvre" }]
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["modbus", "modbus-tcp", "client", "server", "industrial", "automation", "plc"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.optional-dependencies]
# serial line of the gateways of pyModbusTCP.tools (python -m pyModbusTCP.tools tcp2rtu/rtu2tcp)
serial = ["pyserial>=3.5,<4"]
# commands mbtcp-* in the PATH: a separate package without code (console scripts can't depend on an extra, so a
# plain install of the library puts no command in the PATH)
tools = ["pyModbusTCP-tools"]

[project.urls]
Documentation = "https://pymodbustcp.readthedocs.io/"
Source = "https://github.com/sourceperl/pyModbusTCP"
Issues = "https://github.com/sourceperl/pyModbusTCP/issues"
Changelog = "https://github.com/sourceperl/pyModbusTCP/blob/master/CHANGES"

[tool.hatch.version]
# VERSION in pyModbusTCP/constants.py (also the version of pyModbusTCP-tools, see its pyproject.toml)
path = "pyModbusTCP/constants.py"

[tool.hatch.build.targets.sdist]
# the library and its changelog (pyproject.toml, README.rst and LICENSE are always included), without the tests,
# examples, docs, tools/ and the pyModbusTCP-tools package
include = ["/pyModbusTCP", "/CHANGES"]

[tool.hatch.build.targets.wheel]
# the package and all its subpackages (client, server, tools)
packages = ["pyModbusTCP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summary of skipped/failed tests at the end, strict: a typo in a marker or in this config is an error
addopts = ["-ra", "--strict-markers", "--strict-config"]
