[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyModbusTCP"
# optional-dependencies: the extras serial and cli, set by hatch_metadata.py (cli: exactly this release of
# pyModbusTCP-cli, from the version)
dynamic = ["version", "optional-dependencies"]
description = "A simple Modbus/TCP library for Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Loïc Lefebvre" }]
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["modbus", "modbus-tcp", "client", "server", "industrial", "automation", "plc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://pymodbustcp.readthedocs.io/"
Source = "https://github.com/sourceperl/pyModbusTCP"
Issues = "https://github.com/sourceperl/pyModbusTCP/issues"
Changelog = "https://github.com/sourceperl/pyModbusTCP/blob/master/CHANGES"

[tool.hatch.version]
# VERSION in pyModbusTCP/constants.py (also the version of pyModbusTCP-cli, see its pyproject.toml)
path = "pyModbusTCP/constants.py"

[tool.hatch.metadata.hooks.custom]
# the extras serial and cli (cli = exactly this release of pyModbusTCP-cli)
path = "hatch_metadata.py"

[tool.hatch.build.targets.sdist]
# the library, its changelog and its tests (pyproject.toml, README.md and LICENSE are always included): the tests can
# be run from an unpacked sdist (pytest, settings of [tool.pytest.ini_options]), like the downstream packagers do.
# Without the examples, docs, tools/ and the pyModbusTCP-cli package. The wheel has the package only (see below).
# hatch_metadata.py: the extras, needed by a build from the sdist.
include = ["/pyModbusTCP", "/tests", "/CHANGES", "/hatch_metadata.py"]

[tool.hatch.build.targets.wheel]
# the package and all its subpackages (client, server, tools)
packages = ["pyModbusTCP"]

[tool.ruff.lint]
# N999: "pyModbusTCP" is the public name of the package (import pyModbusTCP), it can't change
ignore = ["N999"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summary of skipped/failed tests at the end, strict: a typo in a marker or in this config is an error
addopts = ["-ra", "--strict-markers", "--strict-config"]
# a test that hangs (like a blocked read on a pseudo-terminal) dumps the stack of every thread after 120 s, instead of
# a CI job that only stops on its own timeout without saying where
faulthandler_timeout = 120
