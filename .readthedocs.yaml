# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# the library is imported from the checkout by docs/conf.py: only the doc dependencies are installed
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

# additional formats (in addition to the default HTML)
formats:
  - epub
  - htmlzip
  - pdf
