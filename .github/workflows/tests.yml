# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# The actions are pinned by commit SHA (a tag can be moved to another commit), with the version in a comment, and the
# Python tools by exact version (requirements/ci.txt): Dependabot (.github/dependabot.yml) proposes the
# updates in a pull request.

jobs:
  tests:
    # the test suite (pytest) on every supported Python version and OS
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # the GITHUB_TOKEN is not kept in .git/config: no step needs to push
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        # pip: always the latest release; the tools: their exact version (requirements/ci.txt, Dependabot)
        python -m pip install --upgrade pip
        python -m pip install -r requirements/ci.txt
        # [serial]: pyserial, for the tests of the gateways of pyModbusTCP.tools (skipped without it); no build
        # isolation: the hatchling pinned in requirements/ci.txt builds the package
        python -m pip install --no-build-isolation ".[serial]"

    - name: Test with pytest
      run: |
        pytest

  package:
    # what is released: lint, type check, then the two packages (pyModbusTCP and pyModbusTCP-cli, commands only) built,
    # checked and installed by tools/build_dist.sh, on the oldest and the newest Python of each OS
    name: Package (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # the GITHUB_TOKEN is not kept in .git/config: no step needs to push
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Type check, build and check the two packages
      run: |
        # pip: always the latest release; the tools: their exact version (requirements/dev.txt: the ones of
        # the CI, plus twine for tools/build_dist.sh)
        python -m pip install --upgrade pip
        python -m pip install -r requirements/dev.txt
        python -m pip install --no-build-isolation ".[serial]"
        # lint and type check: here only (6 runs), not in each of the 15 runs of the job tests
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --extend-exclude=build/,docs/
        mypy --strict pyModbusTCP
        # the release script itself, without the release checks (-c): build of the two packages without isolation,
        # twine check, cross requirements (tools/check_dist_requires.py), install in a venv of the library alone
        # (no command, no pyserial, a gateway exits with status 2) and of the library with the commands (-t)
        tools/build_dist.sh -p python -t -c

  docs:
    name: Documentation
    # the Sphinx documentation (as built by Read the Docs): any warning is an error
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # the GITHUB_TOKEN is not kept in .git/config: no step needs to push
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"

    - name: Build the documentation
      run: tools/build_docs.sh -p python
