# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest numpy
        # [serial]: pyserial, for the tests of the gateways of pyModbusTCP.tools (skipped without it)
        python -m pip install ".[serial]"

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-exclude=build/,docs/

    - name: Test with pytest
      run: |
        pytest

  tools:
    # command line tools: pyModbusTCP.tools (in the library) and the package in pyModbusTCP-tools/ (commands only)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Type check with mypy
      run: |
        python -m pip install --upgrade pip
        python -m pip install mypy types-pyserial ".[serial]"
        mypy --strict pyModbusTCP

    - name: Build the two packages
      run: |
        python -m pip install build
        python -m build --outdir dist .
        python -m build --outdir dist pyModbusTCP-tools
        ls dist

    - name: Library alone (no command, no pyserial, tools available with python -m)
      run: |
        python -m venv "$RUNNER_TEMP/lib-only"
        BIN="$RUNNER_TEMP/lib-only/bin"; [ -d "$BIN" ] || BIN="$RUNNER_TEMP/lib-only/Scripts"
        "$BIN/python" -m pip install dist/pymodbustcp-*.whl
        if "$BIN/python" -m pip show pyModbusTCP-tools pyserial >/dev/null 2>&1; then echo "unexpected package"; exit 1; fi
        if ls "$BIN" | grep -q mbtcp; then echo "unexpected command"; exit 1; fi
        "$BIN/python" -m pyModbusTCP.tools server --version
        # a gateway without pyserial: exit status 2 with the way to install it
        set +e; "$BIN/python" -m pyModbusTCP.tools tcp2rtu --help 2> err.txt; status=$?; set -e
        cat err.txt
        [ "$status" -eq 2 ] && grep -q 'pyModbusTCP\[serial\]' err.txt

    - name: Library with the commands (pyModbusTCP-tools)
      run: |
        python -m venv "$RUNNER_TEMP/with-tools"
        BIN="$RUNNER_TEMP/with-tools/bin"; [ -d "$BIN" ] || BIN="$RUNNER_TEMP/with-tools/Scripts"
        "$BIN/python" -m pip install dist/*.whl
        for cmd in mbtcp-server mbtcp-client mbtcp-tcp2rtu mbtcp-rtu2tcp; do "$BIN/$cmd" --version; done
        # the tools package must have the version of the library
        lib_version=$("$BIN/python" -c "import pyModbusTCP; print(pyModbusTCP.__version__)")
        "$BIN/mbtcp-client" --version | grep -qF " $lib_version"
